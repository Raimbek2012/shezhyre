<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Шежире рода Ишаевых</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Шежире рода Ишаевых</h1>
    <p>Генеалогическое древо и история нашей семьи</p>

    <!-- Панель авторизации в шапке -->
    <div id="auth-panel" class="auth-panel">
      <!-- Для гостей -->
      <div id="guest-view">
        <button id="open-auth-modal-btn" class="btn btn-outline">Войти / Регистрация</button>
      </div>
      <!-- Для авторизованных пользователей -->
      <div id="user-view" class="hidden">
        <span id="user-email-display"></span>
        <button id="logout-btn" class="btn btn-small">Выйти</button>
      </div>
    </div>
  </header>

  <main>
    <section id="tree-container">
      <p class="instruction">Чтобы добавлять потомков, необходимо войти в аккаунт.</p>

      <div class="tree">
        <ul>
          <!-- Древо загрузится из Supabase -->
        </ul>
      </div>
    </section>
  </main>

  <!-- Модальное окно Авторизации / Регистрации -->
  <div id="auth-modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <button id="close-auth-modal-btn" class="close-btn">&times;</button>
      <h3 id="auth-title">Вход в систему</h3>

      <form id="auth-form">
        <div class="form-group">
          <label for="auth-email">Email:</label>
          <input type="email" id="auth-email" placeholder="example@mail.com" required>
        </div>

        <div class="form-group">
          <label for="auth-password">Пароль:</label>
          <input type="password" id="auth-password" placeholder="Минимум 6 символов" required minlength="6">
        </div>

        <div class="form-actions-stack">
          <button type="submit" id="auth-submit-btn" class="btn btn-primary">Войти</button>
          <button type="button" id="toggle-auth-mode-btn" class="btn-link">Нет аккаунта? Зарегистрироваться</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Модальное окно добавления родственника -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <button id="close-modal-btn" class="close-btn">&times;</button>
      <h3>Добавить потомка</h3>
      
      <form id="add-child-form">
        <div class="form-group">
          <label for="parent-name-input">Отец / Мать:</label>
          <input type="text" id="parent-name-input" disabled readonly>
        </div>

        <div class="form-group">
          <label for="child-name-input">Имя и Фамилия ребенка:</label>
          <input type="text" id="child-name-input" placeholder="Например: Ишаев Алихан" required>
        </div>

        <div class="form-actions">
          <button type="button" id="cancel-btn" class="btn btn-secondary">Отмена</button>
          <button type="submit" class="btn btn-primary">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <footer>
    <p>© Шежире рода Ишаевых</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
